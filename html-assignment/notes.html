<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cool html tags</title>
</head>
<body>
    <header>
        <h1>HTML tags</h1>
    </header>
    <article>
        <form>
            <label for="name">with this tag you can enter your name!</label>
            <input id="name">
        </form>
        <form>
            <label for="message">this tag lets you write a message!</label>
            <textarea id="message"></textarea>
        </form>
        <form>
            <label for="subject">with this tag you can select your favourite school subject!</label>
            <select id="subject" name="subject">
            <option value="english">english</option>
            <option value="science">science</option>
            <option value="math">math (ew)</option>
            <option value="history">history</option>
            <option value="art">art</option>
            <option value="other">other</option>
            </select>
        </form>
        <p>this tag lets you check off options! what music do you like?</p>
        <form>
            <label for="rock">rock</label>
            <input type="checkbox" id="rock" name="rock">
  
            <label for="classic">classic</label>
            <input type="checkbox" id="classic" name="classic">

            <label for="pop">pop</label>
            <input type="checkbox" id="pop" name="pop">
        </form>
        </form>
        <form>
            <label for="web color picker">this one is really cool, you can pick a color from the color wheel!!!!!!!!!</label>
            <input type="color" id="web color picker">
        </form>
    </article>
    <hr>
    <a href="index.html">this sucks i wanna go back :(</a>
</body>
</html>
